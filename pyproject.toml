[project]
name = "programming-consultant-agent"
version = "0.1.0"
description = "Demo agent for programming training consultation"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
]

[project.scripts]
consultant = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "harness", "api", "db"]
py-modules = ["main"]
